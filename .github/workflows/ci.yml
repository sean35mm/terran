name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: go test -count=1 -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/terran
      - run: sh -n install.sh
      - run: sh -n tests/install_leaf.sh
      - run: sh tests/install_leaf.sh
